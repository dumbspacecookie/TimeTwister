name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS · Build & Test
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # macos-14 runners ship with multiple Xcodes. Pin one so DerivedData
        # and the Swift version stay stable across runs.
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project TimeTwister.xcodeproj \
            -scheme TimeTwister \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | xcpretty || (cat build.log && exit 1)

      - name: Test TimeTwisterCore
        run: |
          set -o pipefail
          xcodebuild \
            -project TimeTwister.xcodeproj \
            -scheme TimeTwisterCoreTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test | tee test.log | xcpretty || (cat test.log && exit 1)

      # Unsigned device-architecture IPA. NOT installable directly — meant to be
      # re-signed locally via Sideloadly / AltStore using a free Apple ID, which
      # lets you sideload to your own iPhone without paying the $99/yr Apple
      # Developer Program fee. The signed install is good for 7 days; re-sign
      # weekly to keep using it.
      - name: Build unsigned IPA (for Sideloadly)
        run: |
          set -o pipefail
          xcodebuild \
            -project TimeTwister.xcodeproj \
            -scheme TimeTwister \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -archivePath build/TimeTwister-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee archive.log | xcpretty || (cat archive.log && exit 1)
          # Hand-pack into an IPA: just a Payload/ dir containing the .app, zipped.
          mkdir -p build/ipa/Payload
          cp -R build/TimeTwister-unsigned.xcarchive/Products/Applications/TimeTwister.app build/ipa/Payload/
          (cd build/ipa && zip -qr ../TimeTwister-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: timetwister-unsigned-ipa
          path: ios/build/TimeTwister-unsigned.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ios/build.log
            ios/test.log
            ios/archive.log
          retention-days: 7

  android:
    name: Android · Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Invoke `gradle` directly rather than `./gradlew` — the wrapper jar isn't
      # committed to the repo (Android Studio regenerates it on first sync locally).
      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Run core tests
        run: gradle :core:test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timetwister-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
