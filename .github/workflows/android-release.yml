name: Android · Release APK

# Push a tag like v0.1.0 (or run manually) to produce a signed release APK and
# attach it to a GitHub Release. Requires these repo secrets:
#   TIMETWISTER_KEYSTORE_BASE64    — base64-encoded .jks keystore file
#   TIMETWISTER_KEYSTORE_PASSWORD  — keystore password
#   TIMETWISTER_KEY_ALIAS          — key alias (default: timetwister)
#   TIMETWISTER_KEY_PASSWORD       — key password
# Without the keystore secret set, the workflow still builds an *unsigned*
# release APK and uploads it as a workflow artifact — useful for smoke
# checks without forcing every contributor to share a keystore.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Attach signed APK to the matching GitHub Release"
        required: false
        default: "false"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # for softprops/action-gh-release

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode keystore (if secret present)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.TIMETWISTER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret — release APK will be unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ../.keystore
          echo "$KEYSTORE_B64" | base64 --decode > ../.keystore/release.jks
          echo "path=$(realpath ../.keystore/release.jks)" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          TIMETWISTER_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          TIMETWISTER_KEYSTORE_PASSWORD: ${{ secrets.TIMETWISTER_KEYSTORE_PASSWORD }}
          TIMETWISTER_KEY_ALIAS: ${{ secrets.TIMETWISTER_KEY_ALIAS }}
          TIMETWISTER_KEY_PASSWORD: ${{ secrets.TIMETWISTER_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetwister-release-apk
          path: android/${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Attach APK to GitHub Release
        # Only on tag pushes that produced a signed APK; manual runs need the input.
        if: |
          steps.keystore.outputs.signed == 'true' &&
          (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.attach_to_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: android/${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
