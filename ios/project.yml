name: TimeTwister
options:
  bundleIdPrefix: com.timetwister
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift *language mode*, not a compiler version — the accepted values are
    # 4.0 / 4.2 / 5.0 / 6.0. This said "5.9" (a toolchain version), which is not a
    # valid SWIFT_VERSION. The compiler used is whatever the selected Xcode ships.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer team ID
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TimeTwisterCore:
    type: framework
    platform: iOS
    sources:
      - TimeTwisterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetwister.core
        DEFINES_MODULE: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES" # so the keyboard extension can link it

  TimeTwister:
    type: application
    platform: iOS
    sources:
      - TimeTwister
    dependencies:
      - target: TimeTwisterCore
        embed: true
      - target: TimeTwisterKeyboard
        embed: true
      - target: TimeTwisterShareExtension
        embed: true
    info:
      path: TimeTwister/Info.plist
      properties:
        CFBundleDisplayName: TimeTwister
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetwister.app
    entitlements:
      path: TimeTwister/TimeTwister.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.timetwister

  TimeTwisterKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - TimeTwisterKeyboard
    dependencies:
      - target: TimeTwisterCore
        embed: false
    info:
      path: TimeTwisterKeyboard/Info.plist
      properties:
        CFBundleDisplayName: TimeTwister
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true # needed to read App Group defaults
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetwister.app.keyboard
    entitlements:
      path: TimeTwisterKeyboard/TimeTwisterKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.timetwister

  TimeTwisterShareExtension:
    # Action Extension — closest iOS analogue to Android's ACTION_PROCESS_TEXT.
    # Activated from any host app that exposes selected text via the share sheet
    # (Notes, Mail, Safari, etc.). Reads the text, splices a multi-TZ stamp in
    # place of the detected time, returns the modified text. Needs no
    # "Allow Full Access" — text is handed in via NSExtensionContext.
    type: app-extension
    platform: iOS
    sources:
      - TimeTwisterShareExtension
    dependencies:
      - target: TimeTwisterCore
        embed: false
    info:
      path: TimeTwisterShareExtension/Info.plist
      properties:
        CFBundleDisplayName: TimeTwister
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetwister.app.share
    entitlements:
      path: TimeTwisterShareExtension/TimeTwisterShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.timetwister

  TimeTwisterCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TimeTwisterCoreTests
    dependencies:
      # embed: true — this is a host-less logic-test bundle, so TimeTwisterCore has
      # to be copied into the .xctest bundle itself or dyld can't find it at run time.
      - target: TimeTwisterCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetwister.core.tests

# XcodeGen generates NO schemes unless they are declared here, and `xcodebuild
# -scheme ...` cannot work without one. Both workflows referenced schemes that
# never existed (`TimeTwister`, and a `TimeTwisterCoreTests` scheme that would
# have needed a test action of its own) — which is why iOS CI has never gone
# green. One scheme, with the core tests wired into its test action; CI selects
# them with `-only-testing:TimeTwisterCoreTests`.
schemes:
  TimeTwister:
    build:
      targets:
        TimeTwister: all
        TimeTwisterCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - TimeTwisterCore
      targets:
        - TimeTwisterCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
