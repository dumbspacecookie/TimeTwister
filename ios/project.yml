name: TimeTwister
options:
  bundleIdPrefix: com.timetwister
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer team ID
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TimeTwisterCore:
    type: framework
    platform: iOS
    sources:
      - TimeTwisterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetwister.core
        DEFINES_MODULE: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES" # so the keyboard extension can link it

  TimeTwister:
    type: application
    platform: iOS
    sources:
      - TimeTwister
    dependencies:
      - target: TimeTwisterCore
        embed: true
      - target: TimeTwisterKeyboard
        embed: true
    info:
      path: TimeTwister/Info.plist
      properties:
        CFBundleDisplayName: TimeTwister
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetwister.app
    entitlements:
      path: TimeTwister/TimeTwister.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.timetwister

  TimeTwisterKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - TimeTwisterKeyboard
    dependencies:
      - target: TimeTwisterCore
        embed: false
    info:
      path: TimeTwisterKeyboard/Info.plist
      properties:
        CFBundleDisplayName: TimeTwister
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true # needed to read App Group defaults
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetwister.app.keyboard
    entitlements:
      path: TimeTwisterKeyboard/TimeTwisterKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.timetwister

  TimeTwisterCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TimeTwisterCoreTests
    dependencies:
      - target: TimeTwisterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timetwister.core.tests
